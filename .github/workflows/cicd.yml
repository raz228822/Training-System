name: Deploy Next.js application

on:
  push:
    branches:
      - deploy-with-ec2

jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Source
          uses: actions/checkout@v4
          
        - name: Create .env file
          run: echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" >> .env && echo "MONGO_PASSWORD=${{ secrets.SITE_URL }} >> .env

        - name: Build docker image
          run: docker build -t raz228822/training_system .

        - name: Login to docker hub
          run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

        - name: Public image to docker hub
          run: docker push raz228822/training_system:latest

    deploy:
      needs: build
      runs-on: self-hosted

      steps:
        - name: Pull image from docker hub
          run: docker pull raz228822/training_system:latest

        - name: Delete old container
          run: docker rm -f training-system-container

        - name: Run docker container
          run: docker run -d -p 3000:3000 --name training-system-container raz228822/training_system
